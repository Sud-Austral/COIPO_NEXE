# nginx del contenedor `app`: sirve el build de React y proxea la API al backend
# por la red interna de Docker. El navegador habla SIEMPRE con el mismo origen, así
# que no hay CORS en ninguna parte (guía 8 §4).
#
# Escucha en 8000 dentro del contenedor; hacia el host se publica como
# ${APP_PORT}:8000 (docker-compose.yml), y el Nginx del servidor —que vive fuera de
# este repo— proxea el dominio a ese puerto.
server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    # `backend` es el nombre del servicio: lo resuelve el DNS interno de Compose,
    # nunca una IP fija.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un rango histórico grande puede tardar más que el default de 60 s.
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Los assets con hash en el nombre pueden cachearse para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta desconocida devuelve el index (routing del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
