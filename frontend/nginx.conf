# nginx del contenedor `app`: sirve el build de React y proxea la API al backend
# por la red interna de Docker. El navegador habla SIEMPRE con el mismo origen, así
# que no hay CORS en ninguna parte (guía 8 §4).
#
# Escucha en 8000 dentro del contenedor; hacia el host se publica como
# ${APP_PORT}:8000 (docker-compose.yml), y el Nginx del servidor —que vive fuera de
# este repo— proxea el dominio a ese puerto.
server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    # `backend` es el nombre del servicio: lo resuelve el DNS interno de Compose,
    # nunca una IP fija.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un rango histórico grande puede tardar más que el default de 60 s.
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Los assets llevan hash de contenido en el nombre: inmutables para siempre.
    # Sin `expires`, que emitiría un Cache-Control duplicado junto a este add_header.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA: cualquier ruta desconocida devuelve el index (routing del cliente).
    #
    # El `no-cache` NO es opcional: el hash de los assets sólo sirve si el navegador
    # vuelve a pedir el index.html que los NOMBRA. Sin cabecera, el navegador aplica
    # caché heurística y puede servir un index viejo —que apunta a assets que ya no
    # existen— contra un backend nuevo.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
