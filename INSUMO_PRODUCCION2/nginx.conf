# arriba por este par. Y en el .env del servidor: MOODLE_SSLPROXY=true — si no,
# Moodle no marca las cookies como Secure y el navegador se queja.
#
# Ojo con el mismo cambio en las demas apps: cualquier flag tipo
# SESSION_HTTPS_ONLY que hoy este en false por servir HTTP plano hay que
# revisarlo el mismo dia, no despues.
# ─────────────────────────────────────────────────────────────────────────────
