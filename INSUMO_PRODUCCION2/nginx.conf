# Vhost de Nginx para el Moodle de CONAF — academia.conaf.cl
#
# Vive en el servidor, NO lo despliega este repositorio. Se versiona aqui como
# referencia para que no se pierda.
#
# RUTA REAL (verificada en vm2 el 2026-08-20):
#   /etc/nginx/sites-available/academia.conaf.cl.conf
#   enlazado desde /etc/nginx/sites-enabled/academia.conaf.cl.conf
# La version anterior de este documento decia ".../sites-available/academia",
# sin la extension .conf: el archivo se renombro y la doc se quedo atras.
#
# APP_PORT=8115. Sin SSL todavia: comprobado que no existe /etc/nginx/ssl/ y que
# ningun vhost escucha en 443.
#
# ─────────────────────────────────────────────────────────────────────────────
# DEPENDENCIA QUE NO SE VE EN ESTE ARCHIVO
#
# La directiva "proxy_set_header Connection $connection_upgrade" NO funciona
# sola: $connection_upgrade lo define un "map" en el contexto http, que en este
# servidor vive en /etc/nginx/conf.d/ajustes-globales.conf:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#   server_tokens off;
#   gzip_types text/css application/javascript application/json image/svg+xml;
#   gzip_min_length 1024;
#
# Si copias este vhost a otro servidor sin llevarte ese map, Nginx arranca pero
# manda la cabecera Connection vacia y los websockets se caen en silencio.
#
# ─────────────────────────────────────────────────────────────────────────────
# AVISO — server_name por IP: hoy hay un conflicto real
#
# "nginx -t" en vm2 devuelve:
#   [warn] conflicting server name "172.31.2.41" on 0.0.0.0:80, ignored
#
# Porque este vhost y dendroenergia.conaf.cl.conf declaran los dos la IP. Nginx
# se queda con el primero por orden alfabetico (este) e ignora el otro: entrar
# por http://172.31.2.41/ lleva a Moodle, nunca a dendroenergia, sin ningun
# error visible. Antes de copiar el patron "dominio + IP" a un vhost nuevo,
# quitar la IP de aqui o del otro. Lo recomendado es no usar la IP en ninguno y
# resolver el dominio por el archivo hosts (ver la nota final).
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    # Ver el aviso de arriba antes de dejar la IP en este server_name.
    server_name academia.conaf.cl 172.31.2.41;

    access_log /var/log/nginx/academia.access.log;
    error_log  /var/log/nginx/academia.error.log;

    # 200m para acompanar a upload_max_filesize/post_max_size de docker/php.ini.
    # Con el 25m habitual, los paquetes SCORM y los respaldos .mbz de curso
    # fallan con un 413 que no deja rastro en los registros de Moodle.
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8115;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Moodle compara este header contra wwwroot: sin el, bucle de redireccion.
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Restaurar un curso grande o reconstruir el indice de busqueda supera
        # los 5 minutos: con 300s la peticion se corta a la mitad del trabajo.
        proxy_connect_timeout  60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# PLANTILLA PARA UNA APP NORMAL (no Moodle)
#
# Las demas apps de la flota usan una version mas corta. Este es el patron real,
# tomado de los vhosts que hoy funcionan en vm2. Sustituir <dominio> y <puerto>:
#
# server {
#     listen 80;
#     server_name <dominio>.conaf.cl;
#
#     access_log /var/log/nginx/<app>.access.log;
#     error_log  /var/log/nginx/<app>.error.log;
#
#     client_max_body_size 25m;
#
#     location / {
#         proxy_pass http://127.0.0.1:<puerto>;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_set_header X-Forwarded-Host $host;
#         proxy_connect_timeout 60s;
#         proxy_send_timeout    120s;
#         proxy_read_timeout    300s;
#     }
# }
#
# Reglas al crear uno:
#   1. El <puerto> es el APP_PORT del .env de esa app. Ver el registro de
#      puertos en 00-HALLAZGOS-Y-ESTADO-REAL.md, seccion 2.
#   2. Un dominio, un archivo. Hoy coipo_entrega_planta tiene dos vhosts con dos
#      dominios distintos y ninguno de los dos es el del nombre del archivo.
#   3. El nombre del archivo debe coincidir con el server_name. Hoy
#      nexe.conaf.cl.conf sirve "entre-planta.conaf.cl" (con errata), y
#      nexe.conaf.cl no responde nada.
#   4. Guion bajo no es valido en un hostname: entrega_planta.conaf.cl no sirve,
#      va entrega-planta.conaf.cl.
#   5. Tras editar, siempre: nginx -t y LEER LOS AVISOS, no solo el "syntax ok".
#      Luego systemctl reload nginx.
#
# Cualquier Host que no case con ningun vhost recibe 444 (conexion cerrada sin
# respuesta) por el catch-all /etc/nginx/sites-enabled/00-default.conf:
#
#   server { listen 80 default_server; server_name _; return 444; }
#
# Si un dominio nuevo devuelve 000 en curl, es esto: el vhost no esta cargado o
# su server_name no es el que crees.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
