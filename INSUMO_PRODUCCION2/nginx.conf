# ─────────────────────────────────────────────────────────────────────────────
# NOTA IMPORTANTE — Moodle tiene UNA sola URL
#
# $CFG->wwwroot es un valor unico: Moodle no soporta responder en varias
# direcciones a la vez. Entrar por una URL distinta a la configurada provoca
# redirecciones al wwwroot, sesiones que se pierden o CSS que no carga.
#
# Por eso, aunque este vhost escuche tambien por IP, la URL canonica debe
# decidirse y respetarse. Recomendado: http://academia.conaf.cl desde ya, y
# mientras el DNS no exista, agregar en el equipo de trabajo:
#
#   C:\Windows\System32\drivers\etc\hosts     (como administrador)
#   172.31.2.41    academia.conaf.cl
#
# Asi se navega la URL definitiva sin esperar al DNS, y no hay que volver a
# cambiar wwwroot mas adelante. Ademas evita depender de la IP en server_name,
# que es justo lo que hoy provoca el aviso de conflicto.
# ─────────────────────────────────────────────────────────────────────────────
